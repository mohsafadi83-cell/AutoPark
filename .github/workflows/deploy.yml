name: Deploy Apps (GitHub Pages iOS PWA & APK Release)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy-ios-pwa-pages:
    name: Deploy iOS / Mobile Web App to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Web App with /AutoPark/ base href
        run: |
          mkdir -p _site
          cp -r mobile/build/web/* _site/
          sed -i 's|<base href="/">|<base href="/AutoPark/">|g' _site/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    name: Publish AutoPark.exe Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Latest Release with Desktop EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AutoPark Latest Release (Server 46.185.128.165)
          body: |
            ### AutoPark v2.0 — Ready-to-Install Downloads
            - **Android App**: `AutoPark.apk` (built automatically by `build-mobile.yml` for `http://46.185.128.165:3000`)
            - **iOS Unsigned IPA**: `AutoPark-iOS.ipa` (built automatically by `build-mobile.yml`)
            - **Windows Desktop**: `AutoPark.exe`
            - **iOS / Safari PWA**: https://mohsafadi83-cell.github.io/AutoPark/ (or `http://46.185.128.165:5174`)
          files: |
            AutoPark.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
