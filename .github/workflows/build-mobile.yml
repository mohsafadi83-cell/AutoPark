name: Build AutoPark Mobile (Android APK & iOS PWA / IPA)

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Company Server Public HTTPS API URL'
        required: true
        default: 'https://crawford-dealers-logos-had.trycloudflare.com'

env:
  API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://crawford-dealers-logos-had.trycloudflare.com' }}

permissions:
  contents: write

jobs:
  build-android-and-ios-pwa:
    name: Build Android APK & iOS Web PWA (46.185.128.165)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze

      - name: Build Android Release APK (AutoPark.apk)
        working-directory: mobile
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          cp build/app/outputs/flutter-apk/app-release.apk ../AutoPark.apk

      - name: Build iOS Web PWA (Safari Add-to-Home-Screen)
        working-directory: mobile
        run: flutter build web --release --base-href / --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Upload Android APK Artifact (AutoPark.apk)
        uses: actions/upload-artifact@v4
        with:
          name: AutoPark-Android-APK
          path: AutoPark.apk
          retention-days: 90

      - name: Upload iOS PWA Artifact (Web Build)
        uses: actions/upload-artifact@v4
        with:
          name: AutoPark-iOS-PWA
          path: mobile/build/web
          retention-days: 90

      - name: Attach AutoPark.apk to Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: AutoPark.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios-ipa-unsigned:
    name: Build iOS Unsigned App Archive (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS Release & Package AutoPark-iOS.ipa
        working-directory: mobile
        run: |
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ../AutoPark-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPark-iOS-IPA
          path: AutoPark-iOS.ipa
          retention-days: 90

      - name: Attach AutoPark-iOS.ipa to Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: AutoPark-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
