[General]
; Primary default language: en | ar
Language=en
; Company Server API (use http://localhost:3000/api/v1 on the server itself, or http://46.185.128.165:3000/api/v1 remotely)
ApiBaseUrl=http://localhost:3000/api/v1
PublicServerIp=46.185.128.165

[PLC]
; البروتوكول: SIEMENS_S7 | OPC_UA | MODBUS_TCP | MQTT | CUSTOM_TCP | MOCK
Protocol=SIEMENS_S7
PlcModel=Siemens SIMATIC S7-1200 CPU 1212C (192.168.0.27:102)
IP=192.168.0.27
Port=102
VncPassword=
Rack=0
Slot=1
OpcUaEndpoint=opc.tcp://192.168.0.27:4840
OpcUaSecurityMode=SignAndEncrypt
ReadOnly=false

[Security]
